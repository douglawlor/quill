name: Sync with upstream

on:
  schedule:
    - cron: '17 3 * * *'  # Daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/Community-Access/quill

      - name: Fetch upstream
        run: git fetch upstream

      - name: Backup fork workflows
        run: |
          mkdir -p /tmp/fork-workflows
          cp -r .github/workflows/* /tmp/fork-workflows/ 2>/dev/null || true
          ls /tmp/fork-workflows/ > /tmp/fork-workflows/list.txt 2>/dev/null || true

      - name: Merge upstream/main (no commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-commit --no-edit

      - name: Remove new upstream workflow files
        run: |
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            basename=$(basename "$f")
            if ! grep -q "^$basename$" /tmp/fork-workflows/list.txt 2>/dev/null; then
              echo "Removing upstream-only workflow: $f"
              git rm --cached "$f" 2>/dev/null || true
              rm -f "$f"
            fi
          done

      - name: Restore fork workflows
        run: |
          cp -r /tmp/fork-workflows/* .github/workflows/ 2>/dev/null || true

      - name: Commit merge
        run: |
          git add -A
          git commit -m "Sync with upstream"

      - name: Push changes
        run: git push origin main