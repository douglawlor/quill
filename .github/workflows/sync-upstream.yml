name: Sync with upstream

on:
  schedule:
    - cron: '17 3 * * *'  # Daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/Community-Access/quill

      - name: Fetch upstream
        run: git fetch upstream

      - name: List fork workflow files
        run: |
          mkdir -p /tmp/fork-workflows
          ls .github/workflows/ > /tmp/fork-workflows/list.txt 2>/dev/null || true

      - name: Merge upstream/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit -m "Sync with upstream"

      - name: Remove new upstream workflow files
        run: |
          # Remove any workflow files that were added by the merge but don't exist in the fork
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            basename=$(basename "$f")
            if ! grep -q "^$basename$" /tmp/fork-workflows/list.txt 2>/dev/null; then
              echo "Removing upstream-only workflow: $f"
              git rm "$f"
            fi
          done

      - name: Commit workflow cleanup
        run: |
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove upstream-only workflow files"
          fi

      - name: Push changes
        run: git push origin main